<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:oklch(0.15 0.012 264);color:oklch(0.97 0.004 264);font-family:'Bricolage Grotesque',sans-serif;position:relative;padding:64px 72px;
background-image:linear-gradient(oklch(1 0 0/.045) 1px,transparent 1px),linear-gradient(90deg,oklch(1 0 0/.045) 1px,transparent 1px);background-size:48px 48px}
.top{display:flex;align-items:center;gap:18px;font:600 18px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:oklch(0.62 0.008 264)}
.top .l{flex:1;height:1px;background:oklch(1 0 0/.14)}
.dot{width:12px;height:12px;background:oklch(0.88 0.2 122)}
h1{margin-top:70px;font-weight:800;font-size:150px;line-height:.84;letter-spacing:-.05em;text-transform:uppercase}
h1 span{display:block;font-weight:500;color:oklch(0.62 0.008 264);letter-spacing:-.035em}
.bar{position:absolute;left:72px;right:72px;bottom:64px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid oklch(1 0 0/.14);padding-top:26px;font:500 22px 'IBM Plex Mono',monospace}
.role{background:oklch(0.88 0.2 122);color:oklch(0.15 0.012 264);font-weight:600;padding:10px 18px;text-transform:uppercase;letter-spacing:.06em}
.meta{color:oklch(0.8 0.006 264)}
</style></head>
<body>
<div class="top"><span class="dot"></span><span>Portafolio</span><span class="l"></span><span>Santiago, Chile</span></div>
<h1>Javier<span>Urbina</span></h1>
<div class="bar"><span class="role">Desarrollador Full Stack</span><span class="meta">Vue · Node.js · PostgreSQL</span></div>
</body></html>
